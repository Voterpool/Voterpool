# Prometheus — вариант 2 (voterpool в compose).
# Скрейп-цели вынесены в scrape.d/: маунт voterpool-bundled.yml или
# voterpool-hostmode.yml (вариант 1) на путь scrape.d/voterpool.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts/*.yml

scrape_config_files:
  - scrape.d/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
